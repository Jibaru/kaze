# Packaging. `npm run dist` turns the built app into an installer.
#
# Everything the renderer and preload need is bundled by electron-vite, so the
# only thing that has to travel as a real dependency is the Agent SDK.

appId: dev.kaze.app
productName: Kaze
copyright: Kaze

directories:
  buildResources: build
  output: dist

# Generated by the `icongen` skill, not hand-drawn. `build/icons/icon.config.json`
# records the settings, so the whole set can be rebuilt from it:
#   node .agents/skills/icongen/scripts/icongen.mjs \n#     --config build/icons/icon.config.json --out build/icons

files:
  - out/**
  - package.json

# The scenario bank, CLAUDE.md and the review skill. Main looks for these at
# `process.resourcesPath/workspace` when packaged, and copies them into the
# user's workspace on every launch, so a new version ships a new rubric.
extraResources:
  - from: workspace
    to: workspace

# The SDK ships its own `claude` binary. Kaze drives the one on your PATH — that
# is the whole premise — but the SDK's is the fallback, and a binary inside an
# asar archive cannot be executed.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**

win:
  target: nsis
  icon: build/icons/icon-512.png
  # Unsigned: signing needs a certificate, which a personal tool does not have,
  # so Windows SmartScreen warns on first run (More info → Run anyway).
  #
  # `signExecutable`, not `signAndEditExecutable` — the latter also skips
  # editing the executable's resources, which is where the icon and the version
  # metadata go, and the build says so only in passing.
  signExecutable: false

nsis:
  # Per-user, so it installs without asking for administrator.
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kaze

mac:
  target: dmg
  icon: build/icons/icon-512.png
  category: public.app-category.developer-tools

linux:
  target: AppImage
  icon: build/icons/icon-512.png
  category: Development
